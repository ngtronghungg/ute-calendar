<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg: #1B1A18;
      --surface: #222120;
      --surface-hover: #2A2927;
      --line: rgba(232, 226, 214, 0.10);
      --line-strong: rgba(232, 226, 214, 0.20);
      --text: #E6E1D8;
      --text-muted: #A09A8E;
      --text-subtle: #77726A;
      --accent: #C0554A;
      --accent-soft: rgba(192, 85, 74, 0.14);
      --ok: #8FA68A;
      --warn: #C9A66B;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 20px 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--text-muted);
      outline: 2px solid var(--accent-soft);
    }

    .notice {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      padding-top: 4px;
    }

    .status-msg {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      display: none;
    }

    .status-msg.error {
      display: block;
      background: rgba(192, 85, 74, 0.1);
      border-left: 2px solid var(--accent);
      color: #E6E1D8;
    }

    .status-msg.success {
      display: block;
      background: rgba(143, 166, 138, 0.1);
      border-left: 2px solid var(--ok);
      color: #E6E1D8;
    }

    .status-msg.loading {
      display: block;
      border-left: 2px solid var(--text-muted);
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    button {
      height: 36px;
      padding: 0 18px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-hover);
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <form id="enableForm" onsubmit="handleEnable(event)">
    <div id="statusBox" class="status-msg"></div>

    <div class="form-group">
      <label for="mssvInput">Mã số sinh viên</label>
      <input type="text" id="mssvInput" placeholder="Ví dụ: 21110001" autocomplete="username" required autofocus />
    </div>

    <div class="form-group">
      <label for="passwordInput">Mật khẩu cổng trường</label>
      <input type="password" id="passwordInput" placeholder="Mật khẩu tài khoản sinh viên" autocomplete="current-password" required />
    </div>

    <p class="notice">
      Mật khẩu chỉ được lưu trong tài khoản Google của bạn. Bạn có thể tắt bất cứ lúc nào từ menu UTE-Calendar.
    </p>

    <div class="actions">
      <button type="button" class="btn-secondary" onclick="google.script.host.close()">Huỷ</button>
      <button type="submit" id="btnSubmit" class="btn-primary">Bật</button>
    </div>
  </form>

  <script>
    function handleEnable(e) {
      e.preventDefault();
      const mssv = document.getElementById('mssvInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const statusBox = document.getElementById('statusBox');
      const btnSubmit = document.getElementById('btnSubmit');

      if (!mssv || !password) {
        statusBox.className = 'status-msg error';
        statusBox.textContent = 'Vui lòng nhập đầy đủ mã số sinh viên và mật khẩu.';
        return;
      }

      btnSubmit.disabled = true;
      statusBox.className = 'status-msg loading';
      statusBox.textContent = 'Đang kiểm tra thông tin với cổng trường...';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            statusBox.className = 'status-msg success';
            statusBox.textContent = res.message || 'Đã bật. Lịch học của bạn đang được thêm vào Google Lịch.';
            setTimeout(function() {
              google.script.host.close();
            }, 1800);
          } else {
            btnSubmit.disabled = false;
            statusBox.className = 'status-msg error';
            statusBox.textContent = (res && res.message) ? res.message : 'MSSV hoặc mật khẩu chưa đúng';
          }
        })
        .withFailureHandler(function(err) {
          btnSubmit.disabled = false;
          statusBox.className = 'status-msg error';
          statusBox.textContent = 'Lỗi kết nối: ' + (err.message || err);
        })
        .enableAutoSync(mssv, password);
    }
  </script>
</body>
</html>
